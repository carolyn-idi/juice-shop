services:
  juice-shop:
    image: juice-shop-local
    expose:
      - "3000"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "3080:80"
      - "3443:443"
    depends_on:
      - "juice-shop"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro